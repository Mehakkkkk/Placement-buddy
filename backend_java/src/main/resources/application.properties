# Server port
server.port=8080

# MySQL Database connection
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/placement_tracker
spring.datasource.username=placement_app
spring.datasource.password=AppUser123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT secret (we'll use this later)
jwt.secret=YourSuperSecretKeyChangeThis123456
jwt.expiration=604800000

logging.level.org.springframework.security=DEBUG